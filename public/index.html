<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Synapse — Eritage ENT Care</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: oklch(0.985 0.005 75); }
  body { -webkit-font-smoothing: antialiased; font-feature-settings: "ss01","ss02"; }
  button { font-family: inherit; cursor: pointer; }
  textarea, input { font-family: inherit; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: oklch(0.88 0.006 75); border-radius: 3px; }
  @media (max-width: 900px) {
    div[style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
  }
  @media (max-width: 900px) {
    div[data-keep-grid="7"] { grid-template-columns: repeat(7,1fr) !important; gap: 3px !important; }
    div[data-keep-grid="4"] { grid-template-columns: repeat(2,1fr) !important; }
    div[data-keep-grid="2"] { grid-template-columns: repeat(2,1fr) !important; }
    div[data-keep-grid="rating"] { grid-template-columns: 30px 1fr 40px !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel" src="synapse-app/primitives.jsx"></script>
<script type="text/babel" src="synapse-app/data.jsx"></script>
<script type="text/babel" src="synapse-app/shell.jsx"></script>
<script type="text/babel" src="synapse-app/dashboard.jsx"></script>
<script type="text/babel" src="synapse-app/views.jsx"></script>
<script type="text/babel" src="synapse-app/app.jsx"></script>
</body>
</html>
