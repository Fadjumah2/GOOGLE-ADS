<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Synapse — GBP Command Center</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: oklch(0.985 0.005 75); }
  body { -webkit-font-smoothing: antialiased; font-feature-settings: "ss01", "ss02"; }
  button { font-family: inherit; }
  ::selection { background: oklch(0.62 0.14 40); color: white; }
  /* scrollbars */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: oklch(0.85 0.008 75); border-radius: 4px; }

  /* Mobile responsive: collapse all inline grid layouts to single column */
  @media (max-width: 900px) {
    /* Any grid with explicit grid-template-columns → stack */
    div[style*="grid-template-columns"] {
      grid-template-columns: 1fr !important;
    }
    /* Reduce padding for content panes */
    main > div > div[style*="padding: 28px 32px"],
    main > div > div[style*='padding: "28px 32px'] {
      padding: 18px 16px 40px !important;
    }
  }
  /* Keep 7-day calendar, review rating bars, and media grid horizontal */
  @media (max-width: 900px) {
    div[data-keep-grid="7"] { grid-template-columns: repeat(7, 1fr) !important; gap: 3px !important; }
    div[data-keep-grid="4"] { grid-template-columns: repeat(2, 1fr) !important; }
    div[data-keep-grid="2"] { grid-template-columns: repeat(2, 1fr) !important; }
    div[data-keep-grid="rating"] { grid-template-columns: 30px 1fr 40px !important; }
  }
</style>
</head>
<body>
<script>window.location.replace('/');</script>
</body>
</html>
