<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Ops Console | Synapse</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="app-container">
        <!-- Persistent Side Navigation -->
        <aside id="sidebar">
            <div class="logo-area">
                <h1>SYNAPSE</h1>
            </div>
            <nav class="main-nav">
                <a href="#" class="nav-item active" data-panel="overview">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Overview</span>
                </a>
                <a href="#" class="nav-item" data-panel="orchestration">
                    <i data-lucide="cpu"></i>
                    <span>Orchestration</span>
                </a>
                <a href="#" class="nav-item" data-panel="workflows">
                    <i data-lucide="workflow"></i>
                    <span>Workflows</span>
                </a>
                <a href="#" class="nav-item" data-panel="timeline">
                    <i data-lucide="activity"></i>
                    <span>Timeline</span>
                </a>
                <a href="#" class="nav-item" data-panel="logs">
                    <i data-lucide="terminal"></i>
                    <span>Logs</span>
                </a>
                <a href="#" class="nav-item" data-panel="files">
                    <i data-lucide="folder-open"></i>
                    <span>Files</span>
                </a>
                <a href="#" class="nav-item" data-panel="integrations">
                    <i data-lucide="blocks"></i>
                    <span>Integrations</span>
                </a>
                <a href="#" class="nav-item" data-panel="settings">
                    <i data-lucide="settings"></i>
                    <span>Settings</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main id="main-content">
            <!-- Top Bar for Context/Actions -->
            <header id="top-bar">
                <h2 id="workspace-title">Workspace: Overview</h2>
            </header>

            <!-- Workspace Area for Modular Panels -->
            <section id="workspace-area">
                <!-- Panels are dynamically injected by script.js -->
            </section>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
      // Initialize icons after page load
      lucide.createIcons();
    </script>

    <!-- Floating Command Palette -->
    <div id="command-palette" class="command-palette">
        <div class="palette-inner">
            <i data-lucide="search" class="search-icon"></i>
            <input type="text" id="command-input" class="terminal-input" placeholder="Type a command or search..." />
        </div>
    </div>
</body>
</html>
