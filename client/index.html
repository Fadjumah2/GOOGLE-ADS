<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Ops Console | Synapse</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="sidebar-overlay"></div>
    <div id="app-container">
        <!-- Mobile Header -->
        <header id="mobile-header">
            <button class="menu-toggle" id="menu-open" aria-label="Open Menu">
                <i data-lucide="menu"></i>
            </button>
            <div class="mobile-logo">SYNAPSE</div>
            <div style="width: 40px;"></div> <!-- Spacer -->
        </header>

        <!-- Sidebar Navigation -->
        <aside id="sidebar">
            <div class="logo-area">
                <h1>SYNAPSE</h1>
                <button class="menu-toggle" id="menu-close" style="display: none;" aria-label="Close Menu">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <nav class="main-nav">
                <a href="#" class="nav-item active" data-panel="overview">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Overview</span>
                </a>
                <a href="#" class="nav-item" data-panel="orchestration">
                    <i data-lucide="cpu"></i>
                    <span>Orchestration</span>
                </a>
                <a href="#" class="nav-item" data-panel="workflows">
                    <i data-lucide="workflow"></i>
                    <span>Workflows</span>
                </a>
                <a href="#" class="nav-item" data-panel="timeline">
                    <i data-lucide="activity"></i>
                    <span>Timeline</span>
                </a>
                <a href="#" class="nav-item" data-panel="logs">
                    <i data-lucide="terminal"></i>
                    <span>Logs</span>
                </a>
                <a href="#" class="nav-item" data-panel="reports">
                    <i data-lucide="pie-chart"></i>
                    <span>Reports</span>
                </a>
                <a href="#" class="nav-item" data-panel="integrations">
                    <i data-lucide="blocks"></i>
                    <span>Integrations</span>
                </a>
                <a href="#" class="nav-item" data-panel="chat">
                    <i data-lucide="message-square"></i>
                    <span>Command Center</span>
                </a>
                <a href="#" class="nav-item" data-panel="settings">
                    <i data-lucide="settings"></i>
                    <span>Settings</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main id="main-content">
            <header id="top-bar">
                <div id="header" style="display:flex; justify-content:space-between; align-items:center; width: 100%;">
                    <h2 id="workspace-title">Workspace: Overview</h2>
                </div>
            </header>

            <section id="workspace-area">
                <!-- Dynamic content injected here -->
            </section>
        </main>
    </div>

    <!-- Command Palette -->
    <div id="command-palette" class="command-palette">
        <div class="palette-inner">
            <i data-lucide="search" style="color: var(--muted-foreground);"></i>
            <input type="text" id="command-input" class="terminal-input" placeholder="Search operations or agents..." autocomplete="off">
        </div>
    </div>

    <script src="script.js"></script>
    <script>
      // Global Lucide init
      lucide.createIcons();
      // Initialize Mode Toggle on load
      window.renderModeToggle();
    </script>
</body>
</html>
